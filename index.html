<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>곰 사냥 작전 배치도</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🐻 곰 사냥 작전 배치도</h1>
  <input id="search" type="search" placeholder="이름 검색">
  <button id="btn-fit">전체 보기</button>
  <button id="btn-rotate">↻ 시점</button>
  <button id="btn-lock">✋ 편집 중</button>
  <span class="sep"></span>
  <button id="btn-members">명단</button>
  <button id="btn-auto">명단 순서로 재배정</button>
  <button id="btn-export" class="primary">배치 내보내기</button>
  <button id="btn-reset">공유본으로</button>
  <span id="dirty" hidden>● 저장 안 된 편집 있음 (내보내기 후 커밋)</span>
</header>
<main>
  <svg id="map"></svg>
  <aside>
    <div class="aside-head">배치 <span id="count"></span><div id="snapshot"></div></div>
    <div id="legend"></div>
    <ul id="list"></ul>
  </aside>
</main>
<div id="toast"></div>

<dialog id="dlg-members">
  <h2>명단</h2>
  <p>한 줄에 한 명, <b>줄 순서 = 전투력 순</b>. 이름 뒤에 참여 곰 번호:<br>
    <code>홍길동 1</code> 곰1 · <code>홍길동 2</code> 곰2 · <code>홍길동 12</code> 둘 다 · <code>홍길동 0</code> 미참여 · 번호 없음 = 미지정<br>
    행성 버프 인원은 맨 뒤에 <code>*</code> (예: <code>홍길동 1 *</code>) → 먼저 앉히고, 둘러싼 1줄을 같은 곰 전투력 상위로 채웁니다.<br>
    같은 구역 자리 중 <b>덫에 가까운 자리부터</b> 순서대로 배정합니다.</p>
  <textarea id="members-text" rows="20"></textarea>
  <label><input id="members-keep" type="checkbox"> 지금 자리 유지 (새 인원만 빈 자리에)</label>
  <div class="dlg-btns"><button data-close>취소</button><button id="members-apply" class="primary">적용</button></div>
</dialog>

<script src="data/base.js"></script>
<script src="data/plan.js"></script>
<script src="js/layout.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/interact.js"></script>
<script src="js/app.js"></script>
</body>
</html>
